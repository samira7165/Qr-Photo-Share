<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan for your photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: grid; place-items: center; padding: clamp(80px, 12vh, 120px) 16px 24px; }
  .logo { position: fixed; top: clamp(16px, 3vh, 32px); left: clamp(16px, 3vw, 40px); height: clamp(40px, 7vh, 72px); width: auto; z-index: 10; }
  .stage { width: 100%; max-width: 1200px; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 5vw, 72px); align-items: center; }
  .photo-side { display: flex; justify-content: center; }
  .photo-side .frame { width: min(100%, 460px); }
  .photo-side .frame img { max-height: 62vh; object-fit: contain; background: #fff; }
  .qr-side { text-align: center; }
  .qr-side h1 { font-size: clamp(2rem, 5vw, 3.4rem); margin: 0 0 8px; line-height: 1.05; }
  .qr-side p { color: var(--muted); font-size: 1.1rem; margin: 0 0 24px; }
  /* Character holding a sign; the live QR is laid over the blank white square on the sign.
     Offsets are that square's position in qr-space-blank.png (953×1651): x 606–856, y 351–601. */
  /* Height leaves room for the heading block above so the whole figure fits on screen */
  .qr-card { position: relative; display: inline-block; height: clamp(360px, calc(100vh - 340px), 900px); aspect-ratio: 953 / 1651; max-width: 100%; }
  .qr-card .sign { display: block; width: 100%; height: 100%; filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); }
  .qr-card .code { position: absolute; left: 63.59%; top: 21.26%; width: 26.23%; aspect-ratio: 1; }
  .hint { margin-top: 18px; font-size: .95rem; color: var(--muted); }
  .waiting { text-align: center; color: var(--muted); }
  .waiting h1 { color: var(--ink); }
  .fade { animation: fade .6s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* Tablet portrait and phones: stack photo above the sign, logo scrolls with the page */
  @media (max-width: 900px) {
    body { padding-top: 16px; display: block; }
    .logo { position: static; display: block; margin: 0 auto 20px; height: clamp(36px, 8vw, 56px); }
    .stage { grid-template-columns: 1fr; gap: 32px; margin: 0 auto; }
    .photo-side .frame { width: min(100%, 520px); }
    .photo-side .frame img { max-height: 50vh; }
    .qr-card { height: auto; width: min(78vw, 420px); }
    .waiting { padding-top: 25vh; }
  }
  @media (max-width: 480px) {
    .qr-side p { font-size: 1rem; margin-bottom: 16px; }
    .qr-card { width: 86vw; }
  }
  /* Short landscape screens (phones/tablets sideways): keep both columns but shrink the sign */
  @media (orientation: landscape) and (max-height: 600px) {
    .qr-card { height: 80vh; width: auto; }
    .qr-side h1 { font-size: 1.8rem; }
    .qr-side p, .hint { display: none; }
  }
  .stamp { display:inline-block; margin-bottom: 14px; padding: 4px 14px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent); font-size: .8rem; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>
<body>
<img class="logo" src="/static/logo.png" alt="Nescafé">
<main id="root">
  <div class="waiting"><h1>Waiting for a photo…</h1><p>Upload one from the admin page.</p></div>
</main>

<script>
let currentId = null;
async function tick() {
  try {
    const r = await fetch('/api/photos/latest', { cache: 'no-store' });
    if (!r.ok) return;
    const p = await r.json();
    if (p.id === currentId) return;
    currentId = p.id;
    document.getElementById('root').innerHTML = `
      <div class="stage fade">
        <div class="photo-side">
          <div class="frame"><img src="${p.imageUrl}" alt="Your photo"><div class="caption">✦ captured moment ✦</div></div>
        </div>
        <div class="qr-side">
          <span class="stamp">Your photo is ready</span>
          <h1>Scan to take it home</h1>
          <p>Point your phone camera at the code</p>
          <div class="qr-card"><img class="sign" src="/static/qr-space-blank.png" alt=""><img class="code" src="${p.qrUrl}" alt="QR code"></div>
          <div class="hint">Opens the photo on your phone — tap download to save.</div>
        </div>
      </div>`;
  } catch {}
}
tick();
setInterval(tick, 3000); // checks for a new upload every 3 seconds
</script>
</body>
</html>
